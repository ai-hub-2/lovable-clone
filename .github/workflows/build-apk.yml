# Android CI – Build & Release Workflow
# Optimized workflow for building and releasing Android APKs
name: Android CI – Build & Release

# Trigger on push or pull request to main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      # Set Android SDK path in temp directory for caching
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk

    steps:
      # -------------------------------------------------------------
      # 1️⃣ Checkout repository (with submodules if any)
      # -------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0                     # Get all tags if needed

      # -------------------------------------------------------------
      # 2️⃣ Create SDK manifest file for cache key configuration
      # -------------------------------------------------------------
      - name: Create SDK manifest file (cache key helper)
        run: |
          cat <<EOF > android-sdk-manifest.txt
          platform-tools
          platforms;android-34
          build-tools;34.0.0
          EOF

      # -------------------------------------------------------------
      # 3️⃣ Restore Android SDK from cache (if exists)
      # -------------------------------------------------------------
      - name: Restore Android SDK cache
        id: android-sdk-cache
        uses: actions/cache@v3
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}
          # Fixed key with manifest file to update when versions change
          key: android-sdk-${{ runner.os }}-${{ hashFiles('android-sdk-manifest.txt') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      # -------------------------------------------------------------
      # 4️⃣ Install Android SDK (if not restored from cache)
      # -------------------------------------------------------------
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
          accept-android-sdk-licenses: true          # Accept core licenses
          log-accepted-android-sdk-licenses: true
          android-sdk-root: ${{ env.ANDROID_SDK_ROOT }}

      # -------------------------------------------------------------
      # 5️⃣ Accept ALL remaining Android SDK licenses (Google-TV, Google-XR, etc.)
      # -------------------------------------------------------------
      - name: Accept ALL Android SDK licences
        run: |
          set -o pipefail
          # "yes" sends 'y' infinitely; if sdkmanager fails after acceptance
          # we continue without failure.
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # -------------------------------------------------------------
      # 6️⃣ Cache Gradle (dependencies, wrapper)
      # -------------------------------------------------------------
      - name: Cache Gradle files
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # -------------------------------------------------------------
      # 7️⃣ Setup JDK 17 (required for Gradle 8+)
      # -------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # -------------------------------------------------------------
      # 8️⃣ Run unit tests
      # -------------------------------------------------------------
      - name: Run unit tests
        uses: gradle/actions@v3
        with:
          arguments: test --no-daemon

      # -------------------------------------------------------------
      # 9️⃣ Build Debug APK
      # -------------------------------------------------------------
      - name: Build Debug APK
        uses: gradle/actions@v3
        with:
          arguments: assembleDebug --no-daemon

      # -------------------------------------------------------------
      # 🔟 Upload Debug APK as artifact
      # -------------------------------------------------------------
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk

      # -------------------------------------------------------------
      # 1️⃣1️⃣ (Optional) Decode keystore for Release signing
      # -------------------------------------------------------------
      - name: Decode keystore (Release signing)
        if: secrets.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      # -------------------------------------------------------------
      # 1️⃣2️⃣ Build signed Release APK (only if keystore available)
      # -------------------------------------------------------------
      - name: Build signed Release APK
        if: secrets.KEYSTORE_BASE64 != ''
        uses: gradle/actions@v3
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        with:
          arguments: |
            assembleRelease
            -Pandroid.injected.signing.store.file=keystore.jks
            -Pandroid.injected.signing.store.password=${KEYSTORE_PASSWORD}
            -Pandroid.injected.signing.key.alias=${KEY_ALIAS}
            -Pandroid.injected.signing.key.password=${KEY_PASSWORD}
            --no-daemon

      # -------------------------------------------------------------
      # 1️⃣3️⃣ Upload Release APK as artifact (if created)
      # -------------------------------------------------------------
      - name: Upload Release APK artifact
        if: secrets.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            **/build/outputs/apk/release/*.apk

      # -------------------------------------------------------------
      # 1️⃣4️⃣ (Optional) Publish Release APK to Google Play
      # -------------------------------------------------------------
      - name: Publish to Google Play (internal track)
        if: |
          secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' &&
          secrets.PLAY_PACKAGE_NAME != '' &&
          secrets.KEYSTORE_BASE64 != ''
        uses: google-github-actions/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.PLAY_PACKAGE_NAME }}
          # If APK name is different, you can modify the pattern
          releaseFiles: |
            **/build/outputs/apk/release/*-release.apk
          # Track to publish to (internal / alpha / beta / production)
          track: ${{ secrets.PLAY_TRACK || 'internal' }}
          status: completed   # Can be draft / halted / completed